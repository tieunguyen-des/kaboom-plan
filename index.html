<title>Kế hoạch Designathon 24h</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: same language as the event's own board. Dark page, sticky yellow countdown card on the left,
   timeline on the right (vertical track, one coloured ring per block, expandable cards).
   Ring colour = the four elements: Earth M1, Fire M2, Water M3, Air M4. A deliberate single dark look. */
:root{
  color-scheme:dark;
  --bg:#150E21; --surface:#221833; --surface2:#2B1F40; --fg:#F5EFFA; --muted:#AA9CC2; --line:#3B2E52;
  --purple:#7B5CFF; --purple-t:#32265E; --purple-fg:#BDAEFF;
  --orange:#FF8F3F; --yellow:#FFD166; --ink:#2A1B00; --brown:#3A2C22; --red:#FF4B3A;
  --earth:#6FD598; --fire:#FF7A63; --water:#7AA5FF; --air:#B3A0FF; --neutral:#C9BEDC;
  --earth-t:#173026; --fire-t:#3A1D1E; --water-t:#17264A; --air-t:#2A2152; --neutral-t:#2A2038;
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;position:relative}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(55% 38% at 12% 34%,rgba(176,112,32,.26),transparent 70%),radial-gradient(48% 36% at 96% 70%,rgba(176,112,32,.2),transparent 70%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1160px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:clamp(22px,3.2vw,28px);font-weight:800}
h3{font-size:17px;font-weight:600}
p{margin:0}
a{color:var(--purple-fg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:14px;padding:14px 0;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.02em;color:var(--red);line-height:1;transform:rotate(-3deg);text-shadow:2px 2px 0 #7A1810}
.brand small{display:block;font-size:11px;letter-spacing:.14em;color:var(--muted);text-shadow:none;font-weight:600;text-transform:uppercase;transform:rotate(3deg);margin-top:2px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--surface);border-radius:999px;padding:6px;max-width:100%}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;color:var(--fg)}
nav.tabs button[aria-selected="true"]{background:#FFC93C;color:var(--ink)}

.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:36px;align-items:start;padding-top:26px}
.layout.full{grid-template-columns:minmax(0,1fr)}
.layout.full aside{display:none}
aside{position:sticky;top:96px;display:grid;gap:18px}
.hang{position:relative;padding-top:60px}
.hang::before,.hang::after{content:"";position:absolute;top:0;width:2px;height:62px;background:rgba(255,255,255,.35)}
.hang::before{left:17%}.hang::after{right:17%}
.clockcard{background:linear-gradient(160deg,#FFE08A,#FFC94D);color:var(--ink);border-radius:26px;padding:22px 20px 20px;text-align:center;display:grid;gap:10px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pills span{background:#FFF6DA;border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.clockcard .lbl{font-weight:600;font-size:15px}
.digits{display:flex;justify-content:center;gap:4px;align-items:flex-start;font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.digits div{display:grid;gap:2px;justify-items:center}
.digits b{font-size:clamp(40px,6vw,54px);line-height:1;letter-spacing:-.02em;min-width:2ch}
.digits i{font-style:normal;font-family:var(--f-body);font-size:10px;letter-spacing:.12em;font-weight:600;opacity:.8}
.digits .c{font-size:44px;line-height:1;opacity:.55;margin-top:0}
.now{font-size:13px;background:rgba(42,27,0,.1);border-radius:12px;padding:8px 10px;text-align:left}
.now b{display:block;font-weight:600}
.legend{background:var(--surface);border-radius:20px;padding:16px 18px;display:grid;gap:10px}
.legend h3{font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.legend div{display:flex;gap:10px;align-items:baseline;font-size:13px}
.legend i{flex:0 0 12px;width:12px;height:12px;border-radius:50%;border:3px solid;transform:translateY(1px)}
.legend span{color:var(--muted);margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}

section.tab{display:grid;gap:22px;align-content:start}
.ctl{display:grid;gap:12px}
.daytoggle{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:22px;padding:6px;gap:6px}
.daytoggle button{border:0;background:transparent;border-radius:17px;padding:12px 8px;text-align:center;font-weight:600;line-height:1.25}
.daytoggle button small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.daytoggle button[aria-pressed="true"]{background:var(--purple);color:#fff}
.daytoggle button[aria-pressed="true"] small{color:#E3DBFF}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .lbl{font-size:12px;color:var(--muted);margin-right:4px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.ghost{margin-left:auto;background:transparent}
.note{background:var(--surface);border-radius:16px;padding:14px 18px;color:var(--muted);font-size:14px}

.tl{position:relative;display:grid;gap:18px;padding-left:46px}
.tl::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:7px;border-radius:4px;background:#3B2C3A}
.blk{position:relative}
.dot{position:absolute;left:-46px;top:22px;width:30px;height:30px;border-radius:50%;border:5px solid var(--orange);background:var(--bg)}
.cardb{background:var(--surface);border-radius:22px;padding:20px 22px;display:grid;gap:8px}
.blk.live .cardb{box-shadow:0 0 0 3px var(--yellow)}
.t1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rng{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4vw,32px);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.dur{font-size:13px;color:var(--muted);font-weight:500}
.tag{background:var(--yellow);color:var(--ink);border-radius:999px;font-size:11px;font-weight:700;padding:2px 10px}
.ttl{font-size:20px;font-weight:700}
.ttl .m{margin-right:6px}
.elp{justify-self:start;display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
.desc{color:var(--muted);max-width:74ch}
.more{margin-top:8px;border:0;width:100%;background:var(--purple-t);color:var(--purple-fg);border-radius:999px;padding:14px;font-weight:600;display:flex;gap:8px;justify-content:center;align-items:center}
.more::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-135deg) translateY(2px);transition:transform .15s}
.more[aria-expanded="false"]::after{transform:rotate(45deg) translateY(-2px)}
.body{border-top:2px dashed var(--line);margin-top:10px;padding-top:16px;display:grid;gap:12px}
.body[hidden]{display:none}
.sub{font-weight:600;font-size:14px;color:var(--muted)}
.todo{display:grid;gap:10px}
.cell label{display:grid;grid-template-columns:24px minmax(130px,176px) minmax(0,1fr);gap:6px 14px;align-items:start;cursor:pointer}
@media (max-width:640px){.cell label{grid-template-columns:24px minmax(0,1fr)}.cell .rl{grid-column:2}.cell .tx{grid-column:2}}
.cell input,.ck input{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:24px;height:24px;border:2px solid var(--orange);border-radius:8px;background:transparent;margin:1px 0 0;display:grid;place-items:center;cursor:pointer}
.cell input:checked,.ck input:checked{background:var(--orange)}
.cell input:checked::after,.ck input:checked::after{content:"";width:6px;height:11px;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg) translate(-1px,-1px)}
.cell .tx{font-size:15px;min-width:0;overflow-wrap:anywhere}
.cell .rl{font-size:12px;font-weight:600;background:var(--surface2);color:var(--purple-fg);border-radius:8px;padding:3px 10px;justify-self:start;line-height:1.4}
.flash .cardb{box-shadow:0 0 0 3px var(--purple)}
.layout.wide{grid-template-columns:minmax(0,1fr)}
.layout.wide aside{display:none}
/* gantt */
.gwrap{background:var(--surface);border-radius:22px;padding:16px 0 12px;display:grid;gap:12px;min-width:0}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 18px;flex-wrap:wrap}
.gtop h2{font-size:20px}
.gbtns{display:flex;gap:6px}
.gbtns button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600}
.gnote{padding:0 18px;font-size:12px;color:var(--muted)}
.gmini{position:relative;margin:0 18px;display:grid;gap:4px;padding-bottom:22px}
.gmrow,.gmlane{position:relative;height:28px}
.gmlane{height:20px}
.gmseg{position:absolute;top:0;bottom:0;border-radius:7px;color:var(--ink);font-size:11px;font-weight:600;padding:0 7px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.gmseg.sl{background:color-mix(in srgb,var(--air) 22%,var(--surface2));background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.1) 0 6px,transparent 6px 12px);color:var(--air)}
.gmticks{position:relative;height:14px}
.gmticks span{position:absolute;top:0;transform:translateX(-50%);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.gmdl{position:absolute;top:0;bottom:22px;border-left:2px dashed var(--yellow);opacity:.8}
.gmnow{position:absolute;top:-4px;bottom:16px;width:3px;border-radius:2px;background:var(--yellow);z-index:3;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.gscroll{overflow-x:auto;padding:4px 18px 12px}
.gmat{display:grid;gap:6px;width:max-content;grid-template-rows:auto repeat(7,minmax(62px,auto))}
.gcorner{grid-row:1;grid-column:1;position:sticky;left:0;z-index:5;background:var(--surface);align-self:end;font-size:12px;color:var(--muted);font-weight:600;padding:0 0 8px}
.gph{position:relative;background:var(--surface2);border-radius:14px;padding:10px 12px;display:grid;gap:3px;align-content:start}
.gph b{font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.gph strong{font-size:13px;line-height:1.25;font-weight:600}
.gph small{font-size:11px;line-height:1.35;color:var(--muted)}
.gph.pnow{outline:2px solid var(--yellow)}
.gpnow{position:absolute;top:-9px;right:10px;background:var(--yellow);color:var(--ink);font-size:10px;font-weight:700;border-radius:999px;padding:1px 8px}
.glab{position:sticky;left:0;z-index:4;background:var(--surface);border:0;border-right:1px solid var(--line);color:var(--fg);text-align:left;font-size:13px;font-weight:600;padding:0 10px 0 0;display:flex;gap:8px;align-items:center;cursor:pointer;line-height:1.25}
.glab b{flex:0 0 26px;height:26px;border-radius:8px;background:var(--purple-t);color:var(--purple-fg);display:grid;place-items:center;font-size:12px}
.gc{border:0;border-radius:12px;padding:9px 11px;font-size:12.5px;line-height:1.35;text-align:left;color:var(--fg);background:color-mix(in srgb,var(--c) 24%,var(--surface2));cursor:pointer;font-family:var(--f-body)}
.gc:hover{background:color-mix(in srgb,var(--c) 40%,var(--surface2))}
.gc.sl{background-color:color-mix(in srgb,var(--air) 16%,var(--surface2));background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 6px,transparent 6px 12px);color:var(--air);font-weight:600}
.gc.gteam{display:grid;align-content:center;font-size:13.5px;line-height:1.6;padding:16px;border:2px dashed color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 12%,var(--surface2))}
.gc.dim,.glab.dim{opacity:.3}
.gleg{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0 18px;font-size:12px;color:var(--muted)}
.gleg span{display:inline-flex;gap:6px;align-items:center}
.gleg i{width:12px;height:12px;border-radius:4px;display:inline-block}
.gleg i.sl{background:color-mix(in srgb,var(--air) 40%,var(--surface2));background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 3px,transparent 3px 6px)}
.cell.done .tx{opacity:.45;text-decoration:line-through}
.cell.sleep .tx{color:var(--air)}
.out{background:var(--brown);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.out .st{flex:0 0 22px;width:22px;height:22px;border:2px solid var(--yellow);border-radius:50%;display:grid;place-items:center;color:var(--yellow);font-size:11px;margin-top:2px}
.out b{display:block;font-size:13px;font-weight:600;color:#E9DCCB}
.out span{font-size:15px}

.gln{display:grid;gap:1px;min-width:0}
.gln strong{font-weight:600}
.gln small{font-weight:500;font-size:11px;color:var(--muted)}
.sbar{position:relative;height:28px;border-radius:9px;background:var(--surface2);overflow:hidden}
.sbar span{position:absolute;top:3px;bottom:3px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink);background:var(--c)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.steps li{display:grid;grid-template-columns:26px 124px minmax(0,1fr);gap:4px 12px;align-items:start;font-size:14.5px}
.stn{width:24px;height:24px;border-radius:50%;background:var(--c);color:var(--ink);font-weight:700;font-size:12px;display:grid;place-items:center}
.stt{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;font-size:13px;padding-top:2px}
@media (max-width:640px){.steps li{grid-template-columns:26px minmax(0,1fr)}.stt,.stx{grid-column:2}}
/* other tabs */
.sec-h{display:grid;gap:6px}
.sec-h p{color:var(--muted);max-width:70ch;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.card{background:var(--surface);border-radius:20px;padding:18px 20px;display:grid;gap:8px;align-content:start;min-width:0}
.card h3{font-size:16px}
.card .sub{font-weight:400}
.card ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 12px;background:var(--neutral-t);color:var(--neutral);justify-self:start}
.pill.earth{background:var(--earth-t);color:var(--earth)}.pill.fire{background:var(--fire-t);color:var(--fire)}
.pill.water{background:var(--water-t);color:var(--water)}.pill.air{background:var(--air-t);color:var(--air)}
.tbl{overflow-x:auto;border-radius:20px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
tr:last-child td{border-bottom:0}
.ck{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.ck li label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:14px}
.ck li.done span{opacity:.45;text-decoration:line-through}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.warn{background:var(--brown);border-radius:16px;padding:14px 18px;font-size:14px}
.warn b{color:var(--yellow)}
.own{width:100%;min-width:90px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:22px}
  aside{position:static}
  .hang{max-width:420px;width:100%;margin:0 auto}
  .tl{padding-left:38px}.dot{left:-38px;width:26px;height:26px;border-width:4px}
  .tl::before{left:9px;width:6px}
  .cardb{padding:16px 16px}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

.cell.one label{grid-template-columns:24px minmax(0,1fr)}
.lang{margin-left:auto;display:flex;background:var(--surface);border-radius:999px;padding:4px;gap:2px}
.lang button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--fg)}
.lang button[aria-pressed="true"]{background:#FFC93C;color:var(--ink)}
.flink{font-size:13px;font-weight:600;color:var(--yellow);margin-left:10px;letter-spacing:0;text-decoration:underline}
.grp{font-size:15px;color:var(--muted);font-weight:600;letter-spacing:.04em;margin-top:4px}
.fl{list-style:none;padding:0!important;display:grid;gap:10px!important}
.fl li{display:grid;gap:2px}
.fl span{color:var(--muted);font-size:13.5px}
.own2{width:100%;min-width:90px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
.shiftsel{width:100%;min-width:130px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
#rwarn ul{margin:6px 0 0}
</style>

<div class="wrap">
<div class="bar">
  <div class="brand">KaBoom<small>Designathon 2026</small></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-t="timeline" data-i="tabTimeline">Timeline 24h</button>
    <button role="tab" data-t="chuan-bi" data-i="tabPrep">Chuẩn bị trước thi</button>
    <button role="tab" data-t="vai-ca" data-i="tabRoles">Vai trò & ca ngủ</button>
    <button role="tab" data-t="nop-bai" data-i="tabSubmit">Nộp bài & chấm điểm</button>
  </nav>
  <div class="lang" role="group" aria-label="Language"><button data-lang="vi" aria-pressed="false">VI</button><button data-lang="en" aria-pressed="false">EN</button></div>
</div>

<div class="layout" id="layout">
  <aside>
    <div class="hang">
      <div class="clockcard" aria-live="off">
        <div class="pills"><span>14–15.11.2026</span><span>The Sentry Q</span></div>
        <div class="lbl" id="cLbl"></div>
        <div class="digits" id="cDigits"></div>
        <div class="now" id="cNow" hidden></div>
      </div>
    </div>
    <div class="legend" id="legend"></div>
  </aside>
  <main>
    <section class="tab" id="tab-timeline"></section>
    <section class="tab" id="tab-chuan-bi" hidden></section>
    <section class="tab" id="tab-vai-ca" hidden></section>
    <section class="tab" id="tab-nop-bai" hidden></section>
  </main>
</div>
</div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let store={};
try{store=JSON.parse(localStorage.getItem("dsnt26")||"{}")}catch(e){store={}}
const save=()=>{try{localStorage.setItem("dsnt26",JSON.stringify(store))}catch(e){}};
const toMin=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
const p2=n=>String(n).padStart(2,"0");

/* ---------- language ---------- */
let lang=store.lang||((navigator.language||"").toLowerCase().startsWith("vi")?"vi":"en");
const U={
vi:{
 pageTitle:"Kế hoạch Designathon 24h",
 tabTimeline:"Timeline 24h",tabPrep:"Chuẩn bị trước thi",tabRoles:"Vai trò & ca ngủ",tabSubmit:"Nộp bài & chấm điểm",tabsAria:"Các phần",

  b.id="b"+i;
  const s=toMin(b.s);
  if(prev>=0&&s<prev)day=15;
  prev=s;
  b.abs=(day-14)*1440+s;
  let e=toMin(b.e); let ed=day;
  if(e<=s){ed=day+1}

  b.day=day;

});

function merge(t,s){
  for(const k in s){
    const v=s[k];
    if(v===null||v===undefined)continue;
    if(typeof v==="object"&&t[k]!==undefined&&t[k]!==null&&typeof t[k]==="object")merge(t[k],v);
    else t[k]=v;
  }
}

  });

   +'<div class="gleg"><span><i style="background:var(--earth)"></i>M1 Earth</span><span><i style="background:var(--fire)"></i>M2 Fire</span><span><i style="background:var(--water)"></i>M3 Water</span><span><i style="background:var(--air)"></i>M4 Air</span><span><i class="sl"></i>'+esc(tt("lSleep"))+'</span><span>'+esc(tt("lTeam"))+'</span><span>'+esc(tt("lHelp"))+'</span></div></div>';
  return h;
}

/* ---------- time blocks ---------- */
function stepsHTML(b){
  const st=STEPS[b.id];if(!st)return "";
  const base=(b.day-14)*1440,c=DOT[b.ms],m=t=>base+toMin(t);
  let bar="",li="";
  st.forEach((x,i)=>{
    const l=(m(x[0])-b.abs)/b.dur*100,w=(m(x[1])-m(x[0]))/b.dur*100;
    bar+='<span style="left:'+l.toFixed(2)+'%;width:calc('+w.toFixed(2)+'% - 2px);opacity:'+(i%2?".62":"1")+'">'+(i+1)+'</span>';
    li+='<li><span class="stn">'+(i+1)+'</span><span class="stt">'+x[0]+'–'+x[1]+' · '+(m(x[1])-m(x[0]))+'′</span><span class="stx">'+esc(nt(x[2]))+'</span></li>';
  });
  return '<div class="sub">'+esc(tt("breakdown"))+'</div><div class="sbar" style="--c:'+c+'">'+bar+'</div><ol class="steps" style="--c:'+c+'">'+li+'</ol>';
}

     +'<h3 class="ttl">'+(el?'<span class="m" style="color:var(--'+el[2]+')">'+el[3]+':</span>':'')+esc(b.t)+'</h3>'
     +(el?'<span class="elp" style="background:var(--'+el[2]+'-t);color:var(--'+el[2]+')">'+el[0]+' · '+el[1]+'</span>':'')

/* ---------- clock ---------- */
const MARKS=[Date.parse("2026-11-14T06:45:00+07:00"),Date.parse("2026-11-15T08:00:00+07:00"),Date.parse("2026-11-15T14:00:00+07:00")];
function tick(){
  const n=nowMin();
  const gn=$("#gnow");
  if(gn){
    if(n>=G0&&n<=G1){gn.style.display="block";gn.style.left=((n-G0)/(G1-G0)*100)+"%"}
    else gn.style.display="none";
  }
  document.querySelectorAll(".gph").forEach(el=>{
    const on=n>=+el.dataset.a&&n<+el.dataset.e;
    el.classList.toggle("pnow",on);
    el.querySelector(".gpnow").hidden=!on;
  });
  document.querySelectorAll("#tab-timeline .blk").forEach(el=>{
    const on=n>=+el.dataset.a&&n<+el.dataset.e;
    el.classList.toggle("live",on);
    el.querySelector(".tag").hidden=!on;
  });
  const mi=MARKS.findIndex(m=>m>Date.now());
  const L=$("#cLbl"),D=$("#cDigits"),N=$("#cNow");
  if(mi<0){L.textContent=tt("ended");D.innerHTML="";N.hidden=true;return}
  const s=Math.max(0,Math.floor((MARKS[mi]-Date.now())/1000));
  const dd=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;
  L.textContent=tt("mk")[mi];
  const u=tt("units");
  const cell=(v,l)=>'<div><b>'+p2(v)+'</b><i>'+l+'</i></div>',c='<span class="c">:</span>';
  D.innerHTML=cell(dd,u[0])+c+cell(hh,u[1])+c+cell(mm,u[2])+c+cell(ss,u[3]);
  const live=B.find(b=>n>=b.abs&&n<b.absEnd);
  if(live){
    const nx=B.find(b=>b.abs>=live.absEnd);
    N.hidden=false;
    N.innerHTML='<b>'+esc(tt("nowLive"))+' · '+live.s+'–'+live.e+'</b>'+esc(live.t)+(nx?'<br><span style="opacity:.75">'+esc(tt("nextUp"))+': '+nx.s+' '+esc(nx.t)+'</span>':'');
  }else N.hidden=true;
}
setInterval(tick,1000);

/* ---------- Roles & sleep shifts ---------- */
function rolesWarn(){
  const msgs=[],fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(m,k)=>o[k]);
  const mains={};
  RK.forEach(k=>{const n=nm(k);if(n)(mains[n]=mains[n]||[]).push(k)});
  const noMain=RK.filter(k=>!nm(k)).length,noBack=RK.filter(k=>!nm2(k)).length;
  if(!Object.keys(mains).length&&!RK.some(k=>nm2(k)))return '<b>'+esc(tt("wTitle"))+':</b> '+esc(tt("wNone"));
  Object.keys(mains).forEach(n=>{
    const ks=mains[n];
    if(ks.length>2)msgs.push(fmt(tt("wOver"),{name:n,n:ks.length}));
    if(new Set(ks.map(shiftOf)).size>1)msgs.push(fmt(tt("wBoth"),{name:n}));
  });
  RK.forEach(k=>{
    const b=nm2(k);if(!b)return;
    if(b===nm(k)){msgs.push(fmt(tt("wSame"),{area:k}));return}
    const theirs=mains[b];
    if(theirs&&theirs.some(x=>shiftOf(x)===shiftOf(k)))msgs.push(fmt(tt("wBackShift"),{area:k}));
  });
  if(noMain)msgs.push(fmt(tt("wUnassigned"),{n:noMain}));
  if(noBack)msgs.push(fmt(tt("wNoBackup"),{n:noBack}));
  return '<b>'+esc(tt("wTitle"))+':</b> '+(msgs.length?'<ul style="margin:6px 0 0;padding-left:18px">'+msgs.map(m=>'<li>'+esc(m)+'</li>').join("")+'</ul>':esc(tt("wOk")));
}
function updateWarn(){const w=$("#rwarn");if(w)w.innerHTML=rolesWarn()}

  const c=tt("rCols"),so=tt("rShiftOpt");
  let h='<div class="sec-h"><h2>'+esc(tt("rTitle"))+'</h2><p>'+esc(tt("rIntro"))+'</p></div>';
  h+='<div class="warn" id="rwarn">'+rolesWarn()+'</div>';
  h+='<div class="tbl"><table><thead><tr>'+c.map(x=>'<th>'+esc(x)+'</th>').join("")+'</tr></thead><tbody>'
   +RK.map(k=>'<tr><td><b data-rk="'+k+'">'+esc(rlabel(k))+'</b></td>'
   +'<td><input class="own" data-k="'+k+'" placeholder="'+esc(tt("rMainPh"))+'" value="'+esc((store.own&&store.own[k])||"")+'"></td>'
   +'<td><input class="own2" data-k="'+k+'" placeholder="'+esc(tt("rBackPh"))+'" value="'+esc((store.own2&&store.own2[k])||"")+'"></td>'
   +'<td><select class="shiftsel" data-k="'+k+'"><option value="1"'+(shiftOf(k)===1?" selected":"")+'>'+esc(so[0])+'</option><option value="2"'+(shiftOf(k)===2?" selected":"")+'>'+esc(so[1])+'</option></select></td></tr>').join("")+'</tbody></table></div>';
  h+='<h2>'+esc(tt("rSpareT"))+'</h2><div class="cards">'+RK.map(k=>'<div class="card"><h3 data-rk="'+k+'">'+esc(rlabel(k))+'</h3><ul>'+ROLES[k].spare.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>').join("")+'</div>';

}

/* ---------- tabs ---------- */
const TABS=["timeline","chuan-bi","vai-ca","nop-bai"];
let curTab="timeline",rolesDirty=false;
function renderTab(t){
  if(t==="timeline")renderTimeline();
  else if(t==="chuan-bi")$("#tab-chuan-bi").innerHTML=prepHTML();
  else if(t==="vai-ca"){$("#tab-vai-ca").innerHTML=rolesHTML();rolesDirty=false}
  else if(t==="nop-bai")$("#tab-nop-bai").innerHTML=subHTML();
}
function show(t){
  if(!TABS.includes(t))t="timeline";
  curTab=t;
  document.querySelectorAll(".tab").forEach(s=>s.hidden=(s.id!=="tab-"+t));
  document.getElementById("layout").classList.toggle("full",t!=="timeline");
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));
  if(t!=="timeline"&&(!$("#tab-"+t).innerHTML||(t==="vai-ca"&&rolesDirty)))renderTab(t);
}
function applyStatic(){
  document.title=tt("pageTitle");
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=tt(el.dataset.i)});
  $("#tabs").setAttribute("aria-label",tt("tabsAria"));

  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
}
function setLang(l){
  lang=l;store.lang=l;save();
  applyData();applyStatic();
  TABS.slice(1).forEach(t=>{$("#tab-"+t).innerHTML=""});
  renderTimeline();
  show(curTab);
}
document.querySelector(".lang").addEventListener("click",e=>{
  const b=e.target.closest("button");if(b&&b.dataset.lang!==lang)setLang(b.dataset.lang);
});
document.querySelector("nav.tabs").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  location.hash=b.dataset.t;
});
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
document.addEventListener("change",e=>{
  const p=e.target.closest("input[data-p]");
  if(p){store.p=store.p||{};store.p[p.dataset.p]=p.checked;save();p.closest("li").classList.toggle("done",p.checked);return}
  const s=e.target.closest("select.shiftsel");

    store.shift=store.shift||{};store.shift[s.dataset.k]=+s.value;save();

let nmT=null;
document.addEventListener("input",e=>{
  const t=e.target;
  if(!t.classList||!(t.classList.contains("own")||t.classList.contains("own2")))return;
  const key=t.classList.contains("own")?"own":"own2";

  clearTimeout(nmT);nmT=setTimeout(renderTimeline,300);
});

/* ---------- start ---------- */
applyData();
applyStatic();
renderTimeline();
show(location.hash.slice(1));
